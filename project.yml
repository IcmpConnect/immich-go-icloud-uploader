name: ImmichGoUploader
options:
  bundleIdPrefix: com.jensschneider
targets:
  ImmichGoUploader:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: "Wird benötigt, um Fotos und Videos für den Immich-Upload zu lesen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jensschneider.ImmichGoUploader
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements.entitlements
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
